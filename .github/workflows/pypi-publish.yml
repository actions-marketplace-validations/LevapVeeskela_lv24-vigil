name: pypi-publish

# Publishes lv24-vigil to PyPI with Trusted Publishing (OIDC): no API token, no
# password and no PyPI secret. PyPI validates the calling GitHub workflow
# against the project's trusted publisher and issues a short-lived upload
# credential.
#
# Triggers:
#   - publishing a GitHub release (tag vX.Y.Z) publishes that version;
#   - manual dispatch with an explicit version (must match the Python package
#     metadata; package.json is checked too when a root manifest exists).
# If the version already exists on PyPI, the publish step is skipped.
#
# Free for a public repository; no paid runners or services are used.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match python/pyproject.toml and python/src/lv24_vigil/__init__.py, e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          raw = (os.environ.get("RELEASE_TAG") or os.environ.get("INPUT_VERSION") or "").strip()
          version = raw[1:] if raw.startswith("v") else raw

          if not version:
              raise SystemExit("::error::No version provided (release tag or workflow input).")

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"::error::Invalid version '{version}'.")

          sources = []

          # lv24-vigil has no root package.json: npm package versions come from
          # the release tag. Validate the manifest when one is present (forks
          # and future layout changes), otherwise say so explicitly.
          package_path = Path("package.json")
          if package_path.is_file():
              try:
                  package_version = json.loads(package_path.read_text(encoding="utf-8"))["version"]
              except (OSError, KeyError, ValueError) as error:
                  raise SystemExit(f"::error::Could not read package.json version: {error}")
              sources.append(("package.json", package_version))
          else:
              print("::notice::No root package.json; the npm version comes from the release tag.")

          try:
              with Path("python/pyproject.toml").open("rb") as handle:
                  pyproject = tomllib.load(handle)
              project = pyproject["project"]
              python_version = project["version"]
          except (OSError, KeyError, tomllib.TOMLDecodeError) as error:
              raise SystemExit(f"::error::Could not read python/pyproject.toml version: {error}")

          if project.get("name") != "lv24-vigil":
              raise SystemExit(
                  f"::error::python/pyproject.toml project name is '{project.get('name')}', expected 'lv24-vigil'."
              )

          init_path = Path("python/src/lv24_vigil/__init__.py")
          try:
              init_text = init_path.read_text(encoding="utf-8")
          except OSError as error:
              raise SystemExit(f"::error::Could not read python __init__.py: {error}")
          match = re.search(r'^__version__[ ]*=[ ]*"([^"]+)"', init_text, re.MULTILINE)
          if not match:
              raise SystemExit(f"::error::Could not find __version__ in {init_path}")
          init_version = match.group(1)

          sources.append(("python/pyproject.toml", python_version))
          sources.append((str(init_path), init_version))

          for path, found in sources:
              if found != version:
                  raise SystemExit(f"::error::Version '{version}' does not match {path} '{found}'.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")

          print(f"Resolved version: {version}")
          PY

      - name: Run launcher tests
        run: python -m unittest discover -s python/tests -v

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Validate distribution metadata
        run: twine check python/dist/*

      - name: Check whether the version is already published
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/lv24-vigil/{version}/json"
          request = urllib.request.Request(url, headers={"User-Agent": "vigil-pypi-publish"})

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code

          if status == 200:
              print(f"::notice::lv24-vigil {version} is already on PyPI; skipping publish.")
              skip = "true"
          elif status == 404:
              print(f"lv24-vigil {version} is not on PyPI yet; publishing.")
              skip = "false"
          else:
              raise SystemExit(f"::error::Unexpected PyPI response status: {status}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={skip}\n")
          PY

      # Trusted Publishing: the action exchanges the GitHub OIDC token for a
      # short-lived PyPI upload credential. No password or API token is set.
      - name: Publish to PyPI
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
